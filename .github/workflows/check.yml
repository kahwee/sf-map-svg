name: Check package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm demo
      - run: pnpm build-storybook
      - run: pnpm build:pages
      - run: pnpm test:package
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories:coverage
      - name: Summarize Storybook coverage
        if: always()
        run: |
          if [ -f coverage/storybook/coverage-summary.json ]; then
            node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'JS'
          import { readFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/storybook/coverage-summary.json', 'utf8'));
          console.log('### Storybook renderer coverage');
          console.log('| Metric | Covered |');
          console.log('| --- | ---: |');
          for (const metric of ['statements', 'branches', 'functions', 'lines']) {
            console.log(`| ${metric} | ${total[metric].pct}% |`);
          }
          JS
          fi
      - name: Upload Storybook coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-coverage
          path: coverage/storybook/
          if-no-files-found: ignore
