name: Check package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:node
      - run: pnpm demo:built
      - run: pnpm build-storybook:built
      - run: pnpm build:pages:built
      - run: pnpm test:package
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:bun
      - name: Bun check for consumers, stories, and website
        run: pnpm check:types:built
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-all-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browsers
      # Record performance for comparison; machine-dependent timings are not a release budget.
      - run: pnpm benchmark:markers --samples=10 --counts=2000
      - name: Upload browser traces and marker benchmark
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks-and-benchmark
          path: |
            test-results/browsers/
            test-results/marker-benchmark.json
          if-no-files-found: ignore
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      # Storybook build and browser installation write different output directories.
      - parallel:
          - run: pnpm exec playwright install --with-deps chromium
          - run: pnpm build-storybook
      - run: pnpm test:stories:coverage:built
      - run: pnpm build:pages:built
      - run: pnpm test:visual
      - run: pnpm test:studio
      - run: pnpm test:pages
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-differences
          path: test-results/visual/
          if-no-files-found: ignore
      - name: Summarize Storybook coverage
        if: always()
        run: |
          if [ -f coverage/storybook/coverage-summary.json ]; then
            node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'JS'
          import { readFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/storybook/coverage-summary.json', 'utf8'));
          console.log('### Storybook renderer coverage');
          console.log('| Metric | Covered |');
          console.log('| --- | ---: |');
          for (const metric of ['statements', 'branches', 'functions', 'lines']) {
            console.log(`| ${metric} | ${total[metric].pct}% |`);
          }
          JS
          fi
      - name: Upload Storybook coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-coverage
          path: coverage/storybook/
          if-no-files-found: ignore
