name: Publish npm package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.4.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'kahwee/sf-map-svg' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require a stable version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Publishing requires a stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Match package metadata to the release
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import pkg from './package.json' with { type: 'json' };
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'Trusted publishing requires npm 11.5.1 or newer');
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          assert.equal(pkg.name, '@kahwee/sf-map-svg');
          assert.equal(pkg.license, 'MIT');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.registry, 'https://registry.npmjs.org/');
          JS
      - name: Require complete changelog in GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/github-release-notes.md"
          node scripts/release-notes.mjs --verify "$RUNNER_TEMP/github-release-notes.md"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      # Browser installation is independent; validation must finish before browser tests.
      - parallel:
          - name: Validate and build package, demo and Storybook
            run: pnpm check && pnpm demo && pnpm build-storybook
          - name: Install browser
            run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories:coverage
      - name: Pack and test the exact archive to publish
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          pnpm test:package --archive "$RUNNER_TEMP"/package/*.tgz
          node --input-type=module - "$RUNNER_TEMP"/package/*.tgz <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const integrity = `sha512-${createHash('sha512').update(readFileSync(process.argv[2])).digest('base64')}`;
          console.log(`Published archive integrity: ${integrity}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Archive integrity: \`${integrity}\`\n`);
          NODE
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --access public --ignore-scripts
