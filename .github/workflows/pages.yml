name: Deploy map explorer
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish npm package]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  package-ready:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if npm view "@kahwee/sf-map-svg@$version" version >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo "Package $version is not on npm yet; the release workflow will deploy it."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: package-ready
    if: needs['package-ready'].outputs.ready == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser installation is independent; validation must finish before browser tests.
      - parallel:
          - run: pnpm check
          - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories:coverage
      - run: pnpm build-storybook
      - name: Wait for the published version
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git show "$RELEASE_COMMIT:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          for attempt in $(seq 1 20); do
            if npm view "@kahwee/sf-map-svg@$version" version >/dev/null 2>&1; then
              echo "PAGES_VERSION=$version" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "npm has not exposed $version yet; rerun this workflow after registry processing."
          exit 1
      - run: pnpm build:pages --released
      - run: pnpm test:visual
      - run: pnpm test:studio
      - run: pnpm test:pages
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
