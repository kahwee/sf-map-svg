name: Deploy map explorer
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish npm package]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories:coverage
      - name: Wait for the published version
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git show "$RELEASE_COMMIT:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          for attempt in $(seq 1 20); do
            if npm view "@kahwee/sf-map-svg@$version" version >/dev/null 2>&1; then
              echo "PAGES_VERSION=$version" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "npm has not exposed $version yet; rerun this workflow after registry processing."
          exit 1
      - run: pnpm build:pages --released
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
